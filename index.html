<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaChat</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    src="https://instachat.ai.studio/"
    title="InstaChat"
    allow="camera; microphone; notifications; geolocation; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
  ></iframe>
</body>
</html>
